<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WeatherGPT - Conversational Weather</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-zenith: #1E5F9E;
      --sky-mid: #7EC8E3;
      --sky-horizon: #EAF6FB;
      --sky-accent: #FFC857;
      --sky-ink: #0B2545;
      --glass-bg: rgba(255, 255, 255, 0.25);
      --glass-border: rgba(255, 255, 255, 0.4);
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.state-clear-day {
      --sky-zenith: #1E5F9E; --sky-mid: #7EC8E3; --sky-horizon: #EAF6FB;
      --sky-accent: #FFC857; --sky-ink: #0B2545;
      --glass-bg: rgba(255, 255, 255, 0.25); --glass-border: rgba(255, 255, 255, 0.4);
    }
    body.state-cloudy {
      --sky-zenith: #5C6B73; --sky-mid: #9DB4C0; --sky-horizon: #C9D6DF;
      --sky-accent: #F2F5F7; --sky-ink: #1B262C;
      --glass-bg: rgba(255, 255, 255, 0.2); --glass-border: rgba(255, 255, 255, 0.3);
    }
    body.state-rain {
      --sky-zenith: #263859; --sky-mid: #3B4B66; --sky-horizon: #6B7A8F;
      --sky-accent: #8FD3FE; --sky-ink: #101820;
      --glass-bg: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.2);
    }
    body.state-storm {
      --sky-zenith: #2B1B33; --sky-mid: #4A3B5C; --sky-horizon: #6E5A7D;
      --sky-accent: #FFE066; --sky-ink: #E5E9F0; 
      --glass-bg: rgba(0, 0, 0, 0.25); --glass-border: rgba(255, 255, 255, 0.1);
    }
    body.state-snow {
      --sky-zenith: #A9C9D6; --sky-mid: #DCE9F0; --sky-horizon: #F7FBFD;
      --sky-accent: #B8E0F5; --sky-ink: #22333B;
      --glass-bg: rgba(255, 255, 255, 0.3); --glass-border: rgba(255, 255, 255, 0.5);
    }
    body.state-clear-night {
      --sky-zenith: #0B1D3A; --sky-mid: #1B2A4A; --sky-horizon: #2E3A59;
      --sky-accent: #F4F1DE; --sky-ink: #E5E9F0;
      --glass-bg: rgba(0, 0, 0, 0.3); --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; 
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: var(--font-ui); color: var(--sky-ink);
      height: 100vh; overflow: hidden; background: var(--sky-horizon);
      transition: color 0.8s, background 0.8s;
    }
    .mono { font-family: var(--font-mono); }
    
    .glass {
      background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); transition: background 0.8s, border-color 0.8s;
    }

    #sky-canvas {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, var(--sky-zenith) 0%, var(--sky-mid) 40%, var(--sky-horizon) 100%);
      transition: background 0.8s; z-index: 1; overflow: hidden; pointer-events: none;
    }
    #celestial-body {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      background: var(--sky-accent); box-shadow: 0 0 40px var(--sky-accent);
      top: 15%; left: 70%; transition: background 0.8s, box-shadow 0.8s, top 1s, left 1s;
    }
    .cloud-layer {
      position: absolute; width: 200%; height: 100%; top: 0; left: 0;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg"><path fill="rgba(255,255,255,0.15)" d="M100,100 Q120,60 160,80 Q200,40 240,80 Q280,60 300,100 Z"/></svg>');
      background-size: 600px auto; background-repeat: repeat-x; opacity: 0; transition: opacity 1s;
    }
    body.state-cloudy .cloud-layer, body.state-rain .cloud-layer, body.state-storm .cloud-layer, body.state-snow .cloud-layer { opacity: 1; }
    #cloud-1 { animation: drift 80s linear infinite; top: 5%; }
    #cloud-2 { animation: drift 50s linear infinite reverse; top: 15%; opacity: 0.5; background-size: 400px auto; }
    
    #particles { position: absolute; width: 100%; height: 100%; }
    .particle-rain, .particle-snow { position: absolute; background: var(--sky-accent); }
    .particle-rain { width: 1.5px; height: 15px; opacity: 0.6; animation: rain-drop 0.7s linear infinite; }
    .particle-snow { width: 5px; height: 5px; border-radius: 50%; opacity: 0.8; animation: snow-flake 3s linear infinite; }
    
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes rain-drop { 0% { transform: translateY(-20px) translateX(0); } 100% { transform: translateY(100vh) translateX(-10vh); } }
    @keyframes snow-flake { 0% { transform: translateY(-20px) translateX(0); } 50% { transform: translateY(50vh) translateX(20px); } 100% { transform: translateY(100vh) translateX(-10px); } }

    .app-container {
      position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; overflow-y: auto;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;
    }
    .brand { font-weight: 600; font-size: 1.1rem; }
    .location-name { font-size: 0.95rem; opacity: 0.9; text-transform: lowercase; }
    .controls { display: flex; align-items: center; gap: 12px; }
    
    .unit-toggle {
      position: relative; display: flex; background: rgba(0,0,0,0.1); border-radius: 999px; padding: 2px; cursor: pointer;
    }
    .unit-toggle .pill {
      position: absolute; top: 2px; left: 2px; width: calc(50% - 2px); height: calc(100% - 4px);
      background: var(--sky-ink); border-radius: 999px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .unit-toggle.is-f .pill { transform: translateX(100%); }
    .unit-toggle span { position: relative; z-index: 1; padding: 2px 10px; font-size: 0.8rem; font-weight: 600; color: var(--sky-ink); transition: color 0.3s; }
    .unit-toggle span.active { color: var(--sky-horizon); }

    .hero {
      height: 55vh; min-height: 300px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center; flex-shrink: 0;
    }
    .temp-big { font-size: 6rem; font-weight: 600; line-height: 1; letter-spacing: -3px; }
    .cond-text { font-size: 1.4rem; font-weight: 500; margin-top: 12px; text-transform: lowercase; }
    .feels-like { font-size: 1rem; opacity: 0.8; margin-top: 4px; }

    .content-below { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
    
    .prompt-bar {
      display: flex; align-items: center; border-radius: 999px; padding: 6px 6px 6px 16px;
      margin-top: -28px; position: relative; z-index: 10; box-shadow: 0 4px 24px rgba(0,0,0,0.05); transition: box-shadow 0.3s;
    }
    .prompt-bar:focus-within { box-shadow: 0 0 0 2px var(--sky-accent), 0 8px 32px rgba(0,0,0,0.1); }
    .prompt-bar input { flex: 1; background: transparent; border: none; font-size: 1.05rem; color: var(--sky-ink); outline: none; font-family: var(--font-ui); }
    .prompt-bar input::placeholder { color: var(--sky-ink); opacity: 0.6; }
    .prompt-bar button[type="submit"] {
      background: var(--sky-ink); color: var(--sky-horizon); border: none; padding: 10px 20px; border-radius: 999px;
      font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: transform 0.2s, filter 0.2s;
    }
    .prompt-bar button[type="submit"]:active { transform: scale(0.95); }
    .prompt-bar button[type="submit"]:hover { filter: brightness(1.1); }
    
    .chips-container {
      display: flex; gap: 8px; overflow-x: auto; margin-top: 16px; scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 999px;
      padding: 6px 14px; font-size: 0.85rem; color: var(--sky-ink); cursor: pointer; white-space: nowrap;
      transition: background 0.2s;
    }
    .chip:hover { background: rgba(255,255,255,0.4); }

    .timeline-title { margin: 32px 0 12px; font-weight: 600; font-size: 0.85rem; opacity: 0.6; text-transform: lowercase; }
    
    .hourly-scroll { display: flex; gap: 24px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .tick { display: flex; flex-direction: column; align-items: center; cursor: default; transition: transform 0.2s; }
    .tick:hover { transform: translateY(-4px); }
    .tick .time { font-size: 0.85rem; opacity: 0.8; margin-bottom: 8px; }
    .tick .icon { font-size: 1.5rem; margin-bottom: 8px; }
    .tick .temp { font-weight: 600; font-size: 1.1rem; }
    
    .daily-scroll { display: flex; flex-direction: column; }
    .day-strip { display: flex; align-items: center; gap: 16px; width: 100%; padding: 12px 0; border-bottom: 1px solid var(--glass-border); }
    .day-strip:last-child { border-bottom: none; }
    .day-strip .day-name { width: 40px; font-weight: 500; }
    .day-strip .icon { font-size: 1.2rem; width: 30px; text-align: center; }
    .day-strip .lo { opacity: 0.7; width: 30px; text-align: right; }
    .day-strip .sparkline { flex: 1; height: 4px; background: rgba(0,0,0,0.1); border-radius: 999px; position: relative; }
    .state-clear-night .day-strip .sparkline, .state-storm .day-strip .sparkline { background: rgba(255,255,255,0.1); }
    .day-strip .spark-fill { position: absolute; height: 100%; background: var(--sky-ink); border-radius: 999px; }
    .day-strip .hi { font-weight: 600; width: 30px; }
    
    .chat-thread { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; }
    .msg { padding: 14px 18px; border-radius: 16px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
    .msg.user { align-self: flex-end; background: var(--sky-ink); color: var(--sky-horizon); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; border-bottom-left-radius: 4px; }
    
    .utils select, .utils button {
      background: transparent; border: none; color: var(--sky-ink); font-size: 0.8rem; font-weight: 600;
      outline: none; cursor: pointer; font-family: var(--font-ui);
    }
    .utils button { padding: 4px 8px; border: 1px solid var(--glass-border); border-radius: 999px; }
    .utils button:hover { background: var(--glass-bg); }

    .loader { display: none; width: 16px; height: 16px; border: 2px solid var(--sky-horizon); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .loader { display: inline-block; }
    .loading .btn-text { display: none; }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 75%);
      background-size: 200% 100%;
      animation: skeleton-load 1.5s infinite;
      border-radius: 4px;
      color: transparent !important;
    }
    .state-clear-day .skeleton {
      background: linear-gradient(90deg, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.05) 75%);
      background-size: 200% 100%;
    }
    @keyframes skeleton-load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Slide-out Panels */
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 360px;
      background: var(--sky-horizon); border-left: 1px solid var(--glass-border);
      box-shadow: -8px 0 32px rgba(0,0,0,0.1); z-index: 100; padding: 24px;
      display: none; opacity: 0; transform: translateX(100%);
      transition: opacity 0.4s, transform 0.4s, display 0.4s;
      transition-behavior: allow-discrete; overflow-y: auto;
    }
    .drawer.open { display: block; opacity: 1; transform: translateX(0); }
    @starting-style { .drawer.open { opacity: 0; transform: translateX(100%); } }
    .drawer-close { background: transparent; border: none; color: var(--sky-ink); font-size: 1.5rem; cursor: pointer; float: right; }

    .onboarding-hint {
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      background: var(--sky-ink); color: var(--sky-horizon); padding: 6px 12px;
      border-radius: 8px; font-size: 0.8rem; margin-top: 12px;
      animation: bounce 2s infinite; pointer-events: none; z-index: 11;
    }
    .onboarding-hint::before {
      content: ''; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      border: 6px solid transparent; border-bottom-color: var(--sky-ink);
    }
    @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }

    @media (prefers-reduced-motion: reduce) {
      #sky-canvas, #celestial-body, .cloud-layer, .particle-rain, .particle-snow, .skeleton, .onboarding-hint { animation: none !important; transition: none !important; }
      body, .glass, .drawer { transition: none !important; }
    }
  </style>
</head>
<body class="state-clear-day">
  <div id="sky-canvas">
    <div id="celestial-body"></div>
    <div id="cloud-1" class="cloud-layer"></div>
    <div id="cloud-2" class="cloud-layer"></div>
    <div id="particles"></div>
  </div>

  <div class="app-container">
    <header class="top-bar glass">
      <div class="brand">WeatherGPT</div>
      <div class="location-name" id="loc-display">Bhopal, IN</div>
      <div class="controls">
        <div class="utils">
          <select id="lang">
            <option value="en">EN</option>
            <option value="hi">HI</option>
          </select>
          <button id="btn-alerts" type="button" onclick="openAlerts()">🔔 Alerts</button>
          <button id="btn-chart" type="button" onclick="openChart()">📈 Climate</button>
        </div>
        <div class="unit-toggle" id="unit-toggle">
          <div class="pill"></div>
          <span class="active">°C</span>
          <span>°F</span>
        </div>
      </div>
    </header>

    <div class="hero">
      <div class="readout">
        <div class="temp-big mono skeleton" id="hero-temp">--°</div>
        <div class="cond-text skeleton" id="hero-cond">loading sky</div>
        <div class="feels-like skeleton" id="hero-feels">...</div>
      </div>
    </div>

    <div class="content-below">
      <div class="prompt-bar glass">
        <form id="chat-form" style="display:flex; width:100%; align-items:center;">
          <input type="text" id="chat-input" placeholder="ask WeatherGPT anything…" autocomplete="off" />
          <button type="button" id="mic-btn" style="background:transparent; border:none; color:var(--sky-ink); font-size:1.2rem; padding:0 8px; cursor:pointer;">🎤</button>
          <button type="submit" id="send-btn">
            <span class="btn-text">Get forecast</span>
            <span class="loader"></span>
          </button>
        </form>
        <div id="onboarding" style="display:none;" class="onboarding-hint">Try asking "will it rain today?"</div>
      </div>
      
      <div class="chips-container" id="chips-container">
        <div class="chip" onclick="setQuery('will it rain today?')">Will it rain today?</div>
        <div class="chip" onclick="setQuery('show me climate trends')">Show me climate trends</div>
        <div class="chip" onclick="setQuery('any extreme alerts?')">Any extreme alerts?</div>
      </div>
      
      <div class="data-streams" id="data-streams">
        <div class="timeline-title">next 24 hours</div>
        <div class="hourly-scroll" id="hourly-scroll" tabindex="0">
          <div class="tick skeleton" style="height:60px; width:40px;"></div>
          <div class="tick skeleton" style="height:60px; width:40px;"></div>
          <div class="tick skeleton" style="height:60px; width:40px;"></div>
        </div>

        <div class="timeline-title">7-day outlook</div>
        <div class="daily-scroll" id="daily-scroll" tabindex="0">
          <div class="day-strip skeleton" style="height:40px; margin-bottom:12px;"></div>
          <div class="day-strip skeleton" style="height:40px; margin-bottom:12px;"></div>
        </div>
      </div>

      <div class="chat-thread" id="chat-thread" aria-live="polite"></div>
    </div>
  </div>

  <div class="drawer glass" id="drawer-alerts">
    <button class="drawer-close" onclick="closeAlerts()">×</button>
    <h3>Alert Subscriptions</h3>
    <form id="subscribe-form" style="display:flex; gap:8px; margin-bottom: 24px;">
      <input type="text" id="sub-name" placeholder="Name (e.g. Home)" class="glass" style="flex:1; border:none; padding:8px; border-radius:8px; color:var(--sky-ink)" required>
      <button type="submit" class="glass" style="border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">Subscribe</button>
    </form>
    <div id="sub-list"></div>
    <div id="alert-list" style="margin-top: 24px; font-size: 0.9rem;"></div>
  </div>

  <div class="drawer glass" id="drawer-chart">
    <button class="drawer-close" onclick="closeChart()">×</button>
    <h3>30-Day Climate</h3>
    <div id="chart-container" style="width:100%; height: 200px; margin-top:24px; position:relative;"></div>
  </div>

  <script>
    // Visual viewport fix for mobile keyboards
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        document.body.style.height = window.visualViewport.height + 'px';
      });
      document.body.style.height = window.visualViewport.height + 'px';
    }

    // Config / State
    let currentLat = null;
    let currentLon = null;
    let currentLocName = 'Bhopal';

    function setQuery(q) {
      document.getElementById('chat-input').value = q;
      document.getElementById('chat-form').dispatchEvent(new Event('submit'));
    }

    function mapWeatherCodeToState(code) {
      if (code <= 1) return 'clear-day';
      if (code <= 3) return 'cloudy';
      if (code <= 67) return 'rain';
      if (code <= 77) return 'snow';
      if (code >= 95) return 'storm';
      return 'cloudy';
    }

    function getWeatherIcon(code) {
      if (code <= 1) return '☀️';
      if (code === 2) return '⛅';
      if (code === 3) return '☁️';
      if (code >= 51 && code <= 67) return '🌧️';
      if (code >= 71 && code <= 82) return '❄️';
      if (code >= 95) return '⛈️';
      return '☁️';
    }

    function updateSkyState(code) {
      let state = mapWeatherCodeToState(code);
      const h = new Date().getHours();
      if (state === 'clear-day' && (h >= 19 || h < 6)) state = 'clear-night';
      
      document.body.className = "state-" + state;
      const container = document.getElementById('particles');
      container.innerHTML = '';
      if (state === 'rain' || state === 'storm') {
        for(let i=0; i<50; i++) {
          const p = document.createElement('div');
          p.className = 'particle-rain';
          p.style.left = Math.random() * 100 + 'vw';
          p.style.animationDuration = 0.5 + Math.random() * 0.3 + 's';
          p.style.animationDelay = Math.random() * 2 + 's';
          container.appendChild(p);
        }
      } else if (state === 'snow') {
        for(let i=0; i<40; i++) {
          const p = document.createElement('div');
          p.className = 'particle-snow';
          p.style.left = Math.random() * 100 + 'vw';
          p.style.animationDuration = 2 + Math.random() * 2 + 's';
          p.style.animationDelay = Math.random() * 3 + 's';
          container.appendChild(p);
        }
      }
    }
    
    let isF = false;
    document.getElementById('unit-toggle').addEventListener('click', function() {
      isF = !isF;
      this.classList.toggle('is-f', isF);
      const spans = this.querySelectorAll('span');
      spans[0].classList.toggle('active', !isF);
      spans[1].classList.toggle('active', isF);
    });

    // Voice setup
    const micBtn = document.getElementById('mic-btn');
    const langSelect = document.getElementById('lang');
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      
      micBtn.addEventListener('click', () => {
        recognition.lang = langSelect.value === 'hi' ? 'hi-IN' : 'en-IN';
        recognition.start();
        micBtn.style.color = 'var(--danger)';
      });
      recognition.onresult = (e) => {
        document.getElementById('chat-input').value = e.results[0][0].transcript;
        document.getElementById('chat-form').dispatchEvent(new Event('submit'));
      };
      recognition.onend = () => { micBtn.style.color = 'var(--sky-ink)'; };
    } else {
      micBtn.style.display = 'none';
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langSelect.value === 'hi' ? 'hi-IN' : 'en-IN';
        speechSynthesis.speak(u);
      }
    }

    // App Init & Fetching
    async function fetchAndRenderWeather(query, isCoords=false) {
      try {
        let url = "/api/weather?" + (isCoords ? query : 'q=' + encodeURIComponent(query)) + "&daily=1&hourly=1";
        const res = await fetch(url);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        
        currentLat = data.lat;
        currentLon = data.lon;
        currentLocName = data.name || query;
        document.getElementById('loc-display').textContent = currentLocName.toLowerCase();
        
        const c = data.current;
        const tempEl = document.getElementById('hero-temp');
        const condEl = document.getElementById('hero-cond');
        const feelsEl = document.getElementById('hero-feels');
        
        tempEl.classList.remove('skeleton');
        condEl.classList.remove('skeleton');
        feelsEl.classList.remove('skeleton');
        
        tempEl.textContent = Math.round(c.temperature_2m) + "°";
        condEl.textContent = getWeatherIcon(c.weather_code) + ' ' + (c.weather_code <= 3 ? 'Clear/Cloudy' : 'Precipitation');
        feelsEl.textContent = "feels like " + Math.round(c.apparent_temperature) + "°";
        updateSkyState(c.weather_code);

        if (data.hourly && data.hourly.time) {
          const now = new Date(); now.setMinutes(0, 0, 0);
          const isoNow = now.toISOString().slice(0, 16);
          let startIndex = data.hourly.time.findIndex(t => t >= isoNow);
          if (startIndex === -1) startIndex = 0;
          
          const slices = [];
          for (let i = startIndex; i < startIndex + 24 && i < data.hourly.time.length; i++) {
            slices.push({
              time: data.hourly.time[i].substring(11, 16),
              icon: getWeatherIcon(data.hourly.weather_code[i]),
              temp: Math.round(data.hourly.temperature_2m[i]) + "°"
            });
          }
          document.getElementById('hourly-scroll').innerHTML = slices.map(h => 
            "<div class='tick'><div class='time mono'>" + h.time + "</div><div class='icon'>" + h.icon + "</div><div class='temp mono'>" + h.temp + "</div></div>"
          ).join('');
        }

        if (data.daily && data.daily.time) {
          const allMins = data.daily.temperature_2m_min;
          const allMaxs = data.daily.temperature_2m_max;
          const absMin = Math.min(...allMins);
          const absMax = Math.max(...allMaxs);
          const range = absMax - absMin || 1;

          const days = [];
          for (let i = 0; i < data.daily.time.length; i++) {
            const date = new Date(data.daily.time[i]);
            const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
            const lo = Math.round(data.daily.temperature_2m_min[i]);
            const hi = Math.round(data.daily.temperature_2m_max[i]);
            const sparkStart = ((lo - absMin) / range) * 100;
            const sparkW = ((hi - lo) / range) * 100;

            days.push({ day: dayName, icon: getWeatherIcon(data.daily.weather_code[i]), lo, hi, sparkStart, sparkW });
          }
          document.getElementById('daily-scroll').innerHTML = days.map(d => 
            "<div class='day-strip'>" +
              "<div class='day-name'>" + d.day + "</div>" +
              "<div class='icon'>" + d.icon + "</div>" +
              "<div class='lo mono'>" + d.lo + "°</div>" +
              "<div class='sparkline'><div class='spark-fill' style='left:" + d.sparkStart + "%; width:" + d.sparkW + "%'></div></div>" +
              "<div class='hi mono'>" + d.hi + "°</div>" +
            "</div>"
          ).join('');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('hero-cond').classList.remove('skeleton');
        document.getElementById('hero-cond').innerHTML = 'Error connecting <button onclick="fetchAndRenderWeather(\'' + query + '\', ' + isCoords + ')" style="background:var(--danger);color:white;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;margin-left:8px;">Retry</button>';
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => fetchAndRenderWeather("lat=" + pos.coords.latitude + "&lon=" + pos.coords.longitude, true).catch(() => fetchAndRenderWeather('Bhopal')),
        () => fetchAndRenderWeather('Bhopal')
      );
    } else {
      fetchAndRenderWeather('Bhopal');
    }

    // Onboarding
    if (!localStorage.getItem('wgpt_onboarded')) {
      document.getElementById('onboarding').style.display = 'block';
      setTimeout(() => { document.getElementById('onboarding').style.display = 'none'; }, 8000);
      localStorage.setItem('wgpt_onboarded', '1');
    }

    // Chat functionality
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatThread = document.getElementById('chat-thread');

    window.retryChat = function(btn) {
      document.getElementById('chat-input').value = btn.dataset.text;
      document.getElementById('chat-form').dispatchEvent(new Event('submit', { cancelable: true }));
    };
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      document.getElementById('onboarding').style.display = 'none'; // hide if chatting
      
      const uMsg = document.createElement('div');
      uMsg.className = 'msg user'; uMsg.textContent = text;
      chatThread.appendChild(uMsg);
      input.value = '';
      sendBtn.classList.add('loading');
      
      const bMsg = document.createElement('div');
      bMsg.className = 'msg bot glass skeleton'; bMsg.textContent = "thinking...";
      chatThread.appendChild(bMsg);
      uMsg.scrollIntoView({ behavior: 'smooth' });
      
      try {
        const res = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, lang: langSelect.value }),
        });
        if(!res.ok) throw new Error("API Error");
        const data = await res.json();
        
        bMsg.classList.remove('skeleton');
        bMsg.textContent = data.reply || "Can't reach the sky right now.";
        speak(bMsg.textContent);

        if (data.location && data.location.toLowerCase() !== currentLocName.toLowerCase()) {
          fetchAndRenderWeather(data.location);
        } else if (data.weather && data.weather.current) {
          updateSkyState(data.weather.current.weather_code);
        }

      } catch (err) {
        bMsg.classList.remove('skeleton');
        bMsg.innerHTML = "Can't reach the sky right now. <a href='#' onclick='window.retryChat(this); return false;'>Retry</a>";
        bMsg.querySelector('a').dataset.text = text;
      } finally {
        sendBtn.classList.remove('loading');
      }
    });

    // Alerts Panel
    let alertsInterval;
    function openAlerts() {
      document.getElementById('drawer-alerts').classList.add('open');
      fetchSubscriptions();
      alertsInterval = setInterval(refreshAlerts, 60000);
    }
    function closeAlerts() {
      document.getElementById('drawer-alerts').classList.remove('open');
      clearInterval(alertsInterval);
    }
    async function fetchSubscriptions() {
      const res = await fetch('/api/subscribe');
      const data = await res.json();
      const list = document.getElementById('sub-list');
      list.innerHTML = data.subscriptions.map(s => 
        "<div style='display:flex; justify-content:space-between; margin-top:8px;'>" +
          "<span>" + s.name + "</span>" +
          "<button onclick='removeSub(" + s.id + ")' style='color:var(--danger); background:transparent; border:none; cursor:pointer;'>Remove</button>" +
        "</div>").join('');
      refreshAlerts();
    }
    async function removeSub(id) { await fetch('/api/subscribe/' + id, { method: 'DELETE' }); fetchSubscriptions(); }
    document.getElementById('subscribe-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('sub-name').value;
      await fetch('/api/subscribe', {
        method: 'POST', headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ name, lat: currentLat, lon: currentLon })
      });
      document.getElementById('sub-name').value = '';
      fetchSubscriptions();
    });
    async function refreshAlerts() {
      const res = await fetch('/api/subscribe/check');
      const data = await res.json();
      const list = document.getElementById('alert-list');
      let html = '';
      data.checks.forEach(c => {
        if (c.alerts && c.alerts.length > 0) {
          html += "<div style='color:var(--danger); margin-bottom:8px;'><strong>" + c.name + "</strong>: " + c.alerts.map(a => a.detail).join(', ') + "</div>";
        }
      });
      list.innerHTML = html || '<i>No active alerts.</i>';
    }

    // Chart Panel
    function openChart() {
      document.getElementById('drawer-chart').classList.add('open');
      if (!currentLat || !currentLon) return;
      fetch('/api/climate?lat=' + currentLat + '&lon=' + currentLon + '&days=30')
        .then(r => r.json())
        .then(data => {
           document.getElementById('chart-container').innerHTML = drawChart(data.daily);
        }).catch(() => document.getElementById('chart-container').innerHTML = 'Failed to load chart');
    }
    function closeChart() { document.getElementById('drawer-chart').classList.remove('open'); }
    function drawChart(daily) {
      if (!daily || !daily.time) return '';
      const maxT = Math.max(...daily.temperature_2m_max);
      const minT = Math.min(...daily.temperature_2m_min);
      const range = maxT - minT || 1;
      const w = 400; const h = 200; const step = w / (daily.time.length - 1);
      
      let maxPath = 'M'; let minPath = 'M';
      daily.time.forEach((t, i) => {
        const x = i * step;
        const yMax = h - ((daily.temperature_2m_max[i] - minT) / range) * h;
        const yMin = h - ((daily.temperature_2m_min[i] - minT) / range) * h;
        maxPath += x + ',' + yMax + ' L'; minPath += x + ',' + yMin + ' L';
      });
      maxPath = maxPath.slice(0, -2); minPath = minPath.slice(0, -2);

      return "<svg width='100%' height='100%' viewBox='0 0 " + w + " " + h + "' preserveAspectRatio='none'>" +
        "<path d='" + maxPath + "' fill='none' stroke='var(--danger)' stroke-width='2'/>" +
        "<path d='" + minPath + "' fill='none' stroke='var(--sky-accent)' stroke-width='2'/>" +
      "</svg>";
    }
  </script>
</body>
</html>
